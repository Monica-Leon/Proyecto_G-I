<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G&I - Lentes de Sol</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Paleta de colores basada en los tonos del PDF */
        :root {
            --bg-color: #FCF4D4; /* Fondo crema */
            --primary-dark: #4A2E2B; /* Marrón oscuro para bordes y texto */
            --accent-color: #B86B52; /* Tono terracota para botones */
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-dark);
            padding: 20px;
        }

        /* Contenedor principal estilo navegador */
        .browser-window {
            background: var(--white);
            border: 4px solid var(--primary-dark);
            border-radius: 12px;
            max-width: 1200px;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 8px 8px 0px rgba(74, 46, 43, 0.2);
        }

        /* Barra de navegación superior */
        header {
            border-bottom: 4px solid var(--primary-dark);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--white);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .search-bar {
            flex-grow: 1;
            margin: 0 40px;
            display: flex;
            border: 2px solid var(--primary-dark);
            border-radius: 20px;
            padding: 5px 15px;
            align-items: center;
        }

        .search-bar input {
            border: none;
            outline: none;
            width: 100%;
            padding: 5px;
            font-size: 16px;
        }

        .icons {
            display: flex;
            gap: 20px;
        }

        .icon-btn {
            background: none;
            border: 2px solid var(--primary-dark);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 18px;
            cursor: pointer;
            color: var(--primary-dark);
            transition: 0.2s;
        }

        .icon-btn:hover {
            background-color: var(--primary-dark);
            color: var(--bg-color);
        }

        /* Contenido Principal */
        main {
            padding: 30px;
        }

        .hero-banner {
            width: 100%;
            height: 200px;
            border: 4px solid var(--primary-dark);
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5e8c7;
            font-size: 24px;
            font-weight: bold;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 4px solid var(--primary-dark);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: var(--white);
        }

        .product-img {
            width: 100%;
            height: 150px;
            background-color: #eee;
            border: 2px solid var(--primary-dark);
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        .btn-add {
            background-color: var(--accent-color);
            color: white;
            border: 2px solid var(--primary-dark);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-add:hover {
            background-color: var(--primary-dark);
        }

        /* Modales (Ventanas emergentes) */
        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--bg-color);
            border: 4px solid var(--primary-dark);
            border-radius: 12px;
            padding: 30px;
            width: 400px;
            text-align: center;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid var(--primary-dark);
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div class="browser-window">
    <header>
        <div class="logo">G&I</div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Buscar lentes...">
        </div>
        <div class="icons">
            <button class="icon-btn" onclick="openModal('loginModal')" title="Usuario"><i class="fa-solid fa-user"></i></button>
            <button class="icon-btn" onclick="openModal('cartModal')" title="Carrito"><i class="fa-solid fa-cart-shopping"></i></button>
            <button class="icon-btn" title="Rastreo de pedido"><i class="fa-solid fa-truck-fast"></i></button>
        </div>
    </header>

    <main>
        <div class="hero-banner">
            Descubre nuestra nueva colección
        </div>

        <div class="product-grid">
            <div class="product-card">
                <div class="product-img"><i class="fa-solid fa-glasses"></i></div>
                <h3>Ray-Ban</h3>
                <p>Estilo clásico</p>
                <button class="btn-add">Agregar a carrito</button>
            </div>
            <div class="product-card">
                <div class="product-img"><i class="fa-solid fa-glasses"></i></div>
                <h3>Prada</h3>
                <p>Diseño exclusivo</p>
                <button class="btn-add">Agregar a carrito</button>
            </div>
            <div class="product-card">
                <div class="product-img"><i class="fa-solid fa-glasses"></i></div>
                <h3>Gucci</h3>
                <p>Tendencia actual</p>
                <button class="btn-add">Agregar a carrito</button>
            </div>
             <div class="product-card">
                <div class="product-img"><i class="fa-solid fa-glasses"></i></div>
                <h3>Chanel</h3>
                <p>Elegancia pura</p>
                <button class="btn-add">Agregar a carrito</button>
            </div>
        </div>
    </main>
</div>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('loginModal')">&times;</span>
        <h2><i class="fa-solid fa-user"></i> Iniciar sesión</h2>
        <input type="email" placeholder="Correo electrónico">
        <input type="password" placeholder="Contraseña">
        <button class="btn-add" style="width: 100%;">Iniciar sesión</button>
    </div>
</div>

<div id="cartModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('cartModal')">&times;</span>
        <h2><i class="fa-solid fa-cart-shopping"></i> Tu Carrito</h2>
        <p style="margin: 20px 0;">No tienes artículos en tu carrito aún.</p>
        <button class="btn-add" style="width: 100%; background-color: var(--primary-dark);">Pagar</button>
    </div>
</div>

<script>
    function openModal(id) {
        document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    // Cerrar modal si se hace clic afuera del contenido
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = "none";
        }
    }
</script>

</body>
</html>
